<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you | Echograph</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: oklch(98.3% 0.008 80); font-family: 'IBM Plex Sans', sans-serif; color: oklch(22% 0.015 80); }
  a { color: #a8593c; text-decoration: none; border-bottom: 1px solid #a8593c; }
</style>
</head>
<body>
<div style="max-width: 560px; margin: 0 auto; padding: 18vh 24px 64px;">
  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #a8593c; margin-bottom: 24px;">Hider</div>
  <h1 style="font-family: 'Source Serif 4', serif; font-weight: 400; font-size: 36px; line-height: 1.2; margin: 0 0 20px;">Thank you.</h1>
  <p style="font-size: 17px; line-height: 1.7; color: oklch(38% 0.015 80); margin: 0 0 16px;">We're also emailing the same link to the address you used at checkout. It usually arrives within a minute; check spam if you don't see it. Links are valid for 48 hours from purchase.</p>
  <p id="dl" style="margin: 0 0 24px;"><a id="dl-link" href="#" hidden style="display: inline-flex; padding: 11px 20px; background: #a8593c; color: #fff; border: none; border-radius: 2px; font-size: 15px;">Download Hider</a></p>
  <p style="font-size: 15px; line-height: 1.7; color: oklch(45% 0.015 80); margin: 0 0 32px;">Stripe will send a separate receipt. Trouble? <a href="contact.html">Get in touch</a>.</p>
  <a href="products.html" style="border-bottom: none;">&larr; Back to Products</a>
</div>
<script>
  (function () {
    var sid = new URLSearchParams(location.search).get('session_id');
    if (!sid) return;
    fetch('/api/session-link?session_id=' + encodeURIComponent(sid))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.url) return;
        var a = document.getElementById('dl-link');
        a.href = d.url;
        a.hidden = false;
      });
  })();
</script>
</body>
</html>
