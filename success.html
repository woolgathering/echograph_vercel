<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you | Echograph</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: oklch(98.3% 0.008 80); font-family: 'IBM Plex Sans', sans-serif; color: oklch(22% 0.015 80); }
  a { color: #a8593c; text-decoration: none; border-bottom: 1px solid #a8593c; }
</style>
</head>
<body>
<div style="max-width: 560px; margin: 0 auto; padding: 18vh 24px 64px;">
  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #a8593c; margin-bottom: 24px;">Hider</div>
  <h1 style="font-family: 'Source Serif 4', serif; font-weight: 400; font-size: 36px; line-height: 1.2; margin: 0 0 20px;">Thank you.</h1>
  <p id="lead" style="font-size: 17px; line-height: 1.7; color: oklch(38% 0.015 80); margin: 0 0 24px;">Preparing your download&hellip;</p>
  <div id="files" style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start; margin: 0 0 28px;"></div>
  <p id="note" style="font-size: 15px; line-height: 1.7; color: oklch(45% 0.015 80); margin: 0 0 16px;" hidden>We've also emailed you a link, valid for 48 hours from purchase. It usually arrives within a minute; check spam if you don't see it.</p>
  <p style="font-size: 15px; line-height: 1.7; color: oklch(45% 0.015 80); margin: 0 0 32px;">Stripe will send a separate receipt. Trouble? <a href="contact.html">Get in touch</a>.</p>
  <a href="products.html" style="border-bottom: none;">&larr; Back to Products</a>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('t'), sid = q.get('session_id');
    var lead = document.getElementById('lead');
    var files = document.getElementById('files');
    if (!t && !sid) { lead.textContent = 'Nothing to download here.'; return; }
    fetch('/api/session-link?' + (t ? 't=' + encodeURIComponent(t) : 'session_id=' + encodeURIComponent(sid)))
      .then(function (r) {
        if (r.status === 403) throw new Error('expired');
        if (!r.ok) throw new Error('failed');
        return r.json();
      })
      .then(function (d) {
        lead.textContent = 'Your download is ready. Links are valid for 48 hours from purchase.';
        if (sid) document.getElementById('note').hidden = false;
        d.assets.forEach(function (a) {
          var el = document.createElement('a');
          el.href = a.url;
          el.textContent = 'Download ' + a.name + ' (' + a.mb + ' MB)';
          el.style.cssText = 'display: inline-flex; padding: 11px 20px; background: #a8593c; color: #fff; border: none; border-radius: 2px; font-size: 15px;';
          files.appendChild(el);
        });
      })
      .catch(function (e) {
        lead.textContent = e.message === 'expired'
          ? 'This download link has expired. Reply to your purchase email and we will send a new one.'
          : 'We could not load your download just now. Please refresh, or check your email for a link.';
      });
  })();
</script>
</body>
</html>
